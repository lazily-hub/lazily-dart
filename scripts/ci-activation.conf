# Exact GitHub Actions activation contract for workflows counted by ci-reach.
workflow: .github/workflows/ci.yml
expected-triggers: .github/workflows/ci.yml|pull_request,push,workflow_dispatch
expected-trigger-filter: .github/workflows/ci.yml|pull_request|
expected-trigger-filter: .github/workflows/ci.yml|push|branches=main
expected-trigger-filter: .github/workflows/ci.yml|workflow_dispatch|
expected-gate-job: .github/workflows/ci.yml|lean
expected-gate-job: .github/workflows/ci.yml|test
expected-gate-job: .github/workflows/ci.yml|core-artifact-consumer
expected-job-activation: .github/workflows/ci.yml|lean|continue-on-error=;if=;needs=
expected-job-activation: .github/workflows/ci.yml|test|continue-on-error=;if=;needs=
expected-job-activation: .github/workflows/ci.yml|core-artifact-consumer|continue-on-error=;if=;needs=
expected-job-matrix: .github/workflows/ci.yml|lean|
expected-job-matrix: .github/workflows/ci.yml|test|sdk=stable,beta
expected-job-matrix: .github/workflows/ci.yml|core-artifact-consumer|dart=3.5.0,3.10.0
# Step-level activation: every run step is unconditional unless pinned here with
# its exact `continue-on-error=<v>;if=<v>`. The formatter gates on stable only
# (see the Format gate comment in ci.yml); any other step-level condition fails.
expected-step-activation: .github/workflows/ci.yml|test|Format gate (make fmt)|continue-on-error=;if=matrix.sdk == 'stable'
